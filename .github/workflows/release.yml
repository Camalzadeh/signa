name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build Check
        run: ./gradlew help

  build-and-release:
    needs: check-and-test
    if: contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
        shell: bash

      - name: Build Android APK
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :composeApp:assembleDebug --build-cache

      - name: Build Desktop Distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --build-cache

      - name: Generate Tag Name
        id: tag
        shell: bash
        run: |
          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          make_latest: true
          files: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/app/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}